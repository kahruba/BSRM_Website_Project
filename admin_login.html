<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login - BSRM</title>

  <link rel="stylesheet" href="styles.css">

  <!-- Bootstrap 5.3.3 -->
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  >

  <style>
    /* Admin login specific styling */
    body {
      background-image: url('images/login-bg.png');
      background-repeat: no-repeat;
      background-position: center center;
      background-size: cover;

      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    .login-box {
      background: rgba(0, 114, 255, 0.85);
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 6px 20px rgba(0,0,0,0.2);
      width: 380px;
      max-width: 100%;
      text-align: center;
      color: white;
      box-sizing: border-box;
    }

    .login-box h2 {
      margin-bottom: 20px;
    }

    .login-box input {
      display: block;
      width: 100%;
      padding: 12px;
      margin: 10px 0;
      border-radius: 6px;
      border: none;
      box-sizing: border-box;
      font-size: 16px;
    }

    .login-box button {
      width: 100%;
      padding: 12px;
      margin-top: 12px;
      border: none;
      border-radius: 6px;
      background-color: #f88f3a;
      color: white;
      font-weight: bold;
      cursor: pointer;
      transition: 0.25s;
    }

    .login-box button:hover {
      background-color: #e68900;
    }

    #message {
      margin-top: 12px;
      font-weight: bold;
      overflow-wrap: anywhere;
    }

    /* Tablet */
    @media (max-width: 768px) {
      .login-box {
        padding: 28px;
      }
    }

    /* Mobile */
    @media (max-width: 480px) {
      body {
        padding: 12px;
      }

      .login-box {
        width: 100%;
        padding: 24px 18px;
        border-radius: 10px;
      }

      .login-box h2 {
        font-size: 24px;
      }
    }
  </style>
</head>

<body>

  <div class="login-box">
    <h2>Admin Login</h2>

    <input
      type="email"
      id="adminEmail"
      placeholder="Enter Admin Email"
      aria-label="Admin Email"
      required
    >

    <input
      type="password"
      id="adminPass"
      placeholder="Enter Password"
      aria-label="Password"
      required
    >

    <button id="loginBtn" type="button">Login</button>

    <p id="message" aria-live="polite"></p>
  </div>

  <script>
    // Fixed admin credentials
    const adminCreds = {
      email: "admin@bsrm.com",
      password: "admin123"
    };

    document.getElementById('loginBtn').addEventListener('click', function() {
      const email = document.getElementById('adminEmail').value.trim();
      const pass = document.getElementById('adminPass').value;

      const message = document.getElementById('message');

      if (email === adminCreds.email && pass === adminCreds.password) {
        // Save login in localStorage
        localStorage.setItem(
          'loggedIn',
          JSON.stringify({
            role: 'admin',
            name: 'BSRM Admin',
            email
          })
        );

        message.textContent = "✅ Login successful! Redirecting...";
        message.style.color = "lightgreen";

        setTimeout(() => {
          window.location.href = "dashboard_admin.html";
        }, 1000);

      } else {
        message.textContent = "❌ Invalid email or password";
        message.style.color = "red";
      }
    });
  </script>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
