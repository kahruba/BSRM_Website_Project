
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Employee Profile - Admin View</title>

  <link rel="stylesheet" href="styles.css">

  <!-- Bootstrap 5.3.3 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f0f2f5;
      margin: 0;
      padding: 0;
    }

    header {
      background: #0072ff;
      color: #fff;
      text-align: center;
      padding: 20px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.2);
    }

    h1 {
      margin: 0;
      font-size: 28px;
    }

    .container {
      width: 400px;
      max-width: 90%;
      margin: 30px auto;
      background: #fff;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 6px 20px rgba(0,0,0,0.1);
      box-sizing: border-box;
    }

    .input-group {
      display: block;
      margin-bottom: 15px;
      text-align: left;
    }

    .input-group label {
      font-weight: bold;
      display: block;
      margin-bottom: 5px;
      color: #333;
    }

    .input-group input,
    .input-group select {
      display: block;
      width: 100%;
      padding: 10px;
      border-radius: 6px;
      border: 1px solid #ccc;
      box-sizing: border-box;
    }

    button {
      width: 100%;
      padding: 12px;
      background: #0072ff;
      color: #fff;
      border: none;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 10px;
      transition: 0.25s;
    }

    button:hover {
      background: #005fcc;
    }

    #message {
      margin-top: 12px;
      font-weight: bold;
      text-align: center;
      overflow-wrap: anywhere;
    }

    @media (max-width: 576px) {
      header {
        padding: 18px 12px;
      }

      h1 {
        font-size: 23px;
      }

      .container {
        width: 400px;
        max-width: calc(100% - 24px);
        margin: 20px auto;
        padding: 22px 18px;
      }
    }
  </style>
</head>

<body>

  <header>
    <h1>Employee Profile (Admin)</h1>
  </header>

  <div class="container">
    <form id="profileForm">
      <div class="input-group">
        <label for="name">Name</label>
        <input type="text" id="name" required>
      </div>

      <div class="input-group">
        <label for="email">Email</label>
        <input type="email" id="email" disabled>
      </div>

      <div class="input-group">
        <label for="status">Status</label>
        <select id="status">
          <option value="pending">Pending</option>
          <option value="confirmed">Confirmed</option>
          <option value="cancelled">Cancelled</option>
        </select>
      </div>

      <button type="submit">Save Changes</button>
      <p id="message" aria-live="polite"></p>
    </form>
  </div>

  <script>
    const logged = JSON.parse(localStorage.getItem('loggedIn'));

    if (!logged || logged.role !== 'admin') {
      alert('Access denied.');
      window.location.href = 'admin_login.html';
    } else {
      const users = JSON.parse(localStorage.getItem('users')) || [];

      // Match the ID saved by employee_list.html
      const viewUserId = JSON.parse(
        localStorage.getItem('viewEmployeeId')
      );

      const user = users.find(u => u.id === viewUserId);

      if (!user) {
        alert('Employee not found.');
        window.location.href = 'employee_list.html';
      } else {
        document.getElementById('name').value = user.name || '';
        document.getElementById('email').value = user.email || '';
        document.getElementById('status').value = user.status || 'pending';

        document.getElementById('profileForm').addEventListener('submit', function(e) {
          e.preventDefault();

          user.name = document.getElementById('name').value;
          user.status = document.getElementById('status').value;

          localStorage.setItem('users', JSON.stringify(users));

          const msg = document.getElementById('message');
          msg.textContent = '✅ Changes saved!';
          msg.style.color = 'green';
        });
      }
    }
  </script>

</body>
</html>
